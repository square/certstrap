---
name: Release

on:
  push:
    tags: [ "*" ]
  # Build, but don't publish, when this workflow changes or on demand, so the
  # release build is exercised before a tag is pushed.
  pull_request:
    paths: [ ".github/workflows/release.yaml" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="dist/certstrap-${GOOS}-${GOARCH}"
          go build -trimpath -o "$out" .

          # Fail if the binary wasn't built for the requested platform.
          go version -m "$out" | grep -Eq "^[[:space:]]+build[[:space:]]+GOOS=${GOOS}$"
          go version -m "$out" | grep -Eq "^[[:space:]]+build[[:space:]]+GOARCH=${GOARCH}$"

          # --version prints the module version that Go stamps from git. A tag
          # build must report exactly that tag, and no build may be dirty or
          # missing git metadata.
          version=$(go version -m "$out" | awk '$1 == "mod" { print $3 }')
          echo "Module version: ${version}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::binary reports ${version}, want tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [[ "$version" == "(devel)" || "$version" == *+dirty ]]; then
            echo "::error::binary reports ${version}, want a version from a clean git checkout"
            exit 1
          fi
          if [[ "$GOOS" == linux && "$GOARCH" == amd64 ]]; then
            test "$("./$out" --version)" = "certstrap version ${version#v}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: certstrap-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/certstrap-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          pattern: certstrap-*
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum certstrap-* > SHA256SUMS
          flags=(--verify-tag --draft --generate-notes
            --title "Version ${TAG#v}"
            --notes "Release Build (from ${GITHUB_REF}/${GITHUB_SHA})")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" certstrap-* SHA256SUMS "${flags[@]}"
